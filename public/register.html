<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja | BHP w praktyce</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="fonts.css">
</head>
<body class="min-h-screen bg-radial from-gray-200 to-gray-100 font-inter text-[#171717]">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center gap-6 px-5 py-10">
        <header class="flex items-center justify-center gap-3">
            <img src="/assets/logos/logo.svg" alt="" class="h-10 w-10 shrink-0 object-contain sm:h-12 sm:w-12">
            <h1 class="font-manrope text-2xl font-bold sm:text-3xl">BHP w praktyce</h1>
        </header>
        <section class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
            <div class="mb-6 flex flex-col gap-2">
                <h2 class="font-manrope text-xl font-bold">Utwórz konto</h2>
                <p class="text-sm text-gray-600">Podaj kod od organizatora, a następnie ustaw dane do logowania.</p>
            </div>
            <p role="alert" class="mb-3 text-sm text-red-700">{{ERROR}}</p>
            <p role="status" class="mb-3 text-sm text-green-800">{{NOTICE}}</p>
            <div class="mb-4">{{REGISTRATION_STATUS}}</div>
            <form action="/register" method="post" class="flex flex-col gap-4">
                <div class="flex flex-col gap-2">
                    <label for="registration_code" class="text-sm font-semibold">Kod organizatora</label>
                    <input id="registration_code" name="registration_code" required autocomplete="off" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="username" class="text-sm font-semibold">Login</label>
                    <input id="username" name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" value="{{USERNAME}}" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-semibold">E-mail</label>
                    <input id="email" name="email" type="email" required maxlength="254" autocomplete="email" value="{{EMAIL}}" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="password" class="text-sm font-semibold">Hasło <span class="font-normal text-gray-500">(min. 10 znaków)</span></label>
                    <input id="password" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                </div>
                <div class="flex flex-col gap-2">
                    <label for="password_confirmation" class="text-sm font-semibold">Powtórz hasło</label>
                    <input id="password_confirmation" name="password_confirmation" type="password" required minlength="10" maxlength="128" autocomplete="new-password" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                </div>
                <button type="submit" class="h-12 rounded-lg bg-[#171717] font-semibold text-white hover:bg-gray-800 focus:outline-2 focus:outline-offset-2">Utwórz konto</button>
            </form>
            <p class="mt-5 text-center text-sm text-gray-600">Masz już konto? <a href="/student.html" class="font-semibold text-[#171717] underline underline-offset-4">Zaloguj się</a></p>
        </section>
    </main>
</body>
</html>
