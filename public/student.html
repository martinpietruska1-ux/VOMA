<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie | BHP w praktyce</title>
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="fonts.css">
</head>
<body class="min-h-screen bg-radial from-gray-200 to-gray-100 font-inter text-[#171717]">
    <main class="mx-auto flex min-h-screen w-full max-w-md flex-col justify-center gap-6 px-5 py-10">
        <header class="flex items-center justify-center gap-3">
            <img src="/assets/logos/logo.svg" alt="" class="h-10 w-10 shrink-0 object-contain sm:h-12 sm:w-12">
            <h1 class="font-manrope text-2xl font-bold sm:text-3xl">BHP w praktyce</h1>
        </header>
        <div class="flex flex-col gap-4">
            <p role="alert" class="text-sm text-red-700">{{ERROR}}</p>
            <p role="status" class="text-sm text-green-800">{{NOTICE}}</p>
            <form action="/login" method="post" class="flex flex-col gap-4">
                <section class="flex flex-col gap-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="auth-code-title">
                    <div class="flex flex-col gap-1.5">
                        <h2 id="auth-code-title" class="font-manrope text-lg font-bold">Kod autoryzacyjny</h2>
                        <p class="text-sm text-gray-600">Wpisz 6-cyfrowy kod od organizatora.</p>
                    </div>
                    <div class="grid grid-cols-6 gap-2 sm:gap-3">
                        <input name="auth_digit_1" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required autocomplete="one-time-code" aria-label="Cyfra 1 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                        <input name="auth_digit_2" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required aria-label="Cyfra 2 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                        <input name="auth_digit_3" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required aria-label="Cyfra 3 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                        <input name="auth_digit_4" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required aria-label="Cyfra 4 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                        <input name="auth_digit_5" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required aria-label="Cyfra 5 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                        <input name="auth_digit_6" type="text" inputmode="numeric" pattern="[0-9]" maxlength="1" required aria-label="Cyfra 6 kodu" class="h-12 min-w-0 rounded-lg border border-gray-300 text-center text-lg outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                    </div>
                </section>
                <section class="flex flex-col gap-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="login-title">
                    <div class="flex flex-col gap-1.5">
                        <h2 id="login-title" class="font-manrope text-xl font-bold">Zaloguj się</h2>
                        <p class="text-sm text-gray-600">Podaj login lub e-mail oraz hasło do konta.</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="identifier" class="text-sm font-semibold">Login lub e-mail</label>
                        <input id="identifier" name="identifier" required autocomplete="username" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                    </div>
                    <div class="flex flex-col gap-2">
                        <label for="password" class="text-sm font-semibold">Hasło</label>
                        <input id="password" name="password" type="password" required autocomplete="current-password" class="h-12 rounded-lg border border-gray-300 px-3 outline-none focus:border-gray-700 focus:ring-2 focus:ring-gray-300">
                    </div>
                    <button type="submit" class="h-12 rounded-lg bg-[#171717] font-semibold text-white hover:bg-gray-800 focus:outline-2 focus:outline-offset-2">Zaloguj się</button>
                </section>
            </form>
        </div>
        <p class="text-center text-sm text-gray-600">Nie masz konta? <a href="/register.html" class="font-semibold text-[#171717] underline underline-offset-4">Utwórz konto</a></p>
    </main>
</body>
</html>
